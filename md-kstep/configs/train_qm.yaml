# Training on xTB trajectories (data/qm). Same trainer as the classical models.
seed: 42
batch_size: 128
lr: 3.0e-4
lr_min: 1.0e-5
warmup_steps: 500
max_steps: 40000
grad_clip: 5.0
lambda_vel: 1.0
ema_decay: 0.999
val_every_steps: 1000
max_val_batches: 50
log_every_steps: 100
wandb:
  enabled: false
  project: md-kstep
